services:
  postgres:
    image: postgres:15-alpine
    container_name: jobatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobatlas}
      POSTGRES_USER: ${POSTGRES_USER:-jobatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobatlas_dev_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobatlas} -d ${POSTGRES_DB:-jobatlas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobatlas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-jobatlas}:${POSTGRES_PASSWORD:-jobatlas_dev_password}@postgres:5432/${POSTGRES_DB:-jobatlas}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-service-key}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
