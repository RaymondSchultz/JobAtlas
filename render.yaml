services:
  # 1. Backend Express API Web Service
  - type: web
    name: jobatlas-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobatlas-db
          property: connectionString
      - key: INTERNAL_SERVICE_KEY
        value: dev-internal-service-key
      - key: JWT_SECRET
        value: dev-only-secret-jwt-key

  # 2. Frontend Next.js Web Service
  - type: web
    name: jobatlas-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://jobatlas-backend.onrender.com/api/v1

databases:
  # 3. Managed PostgreSQL Database
  - name: jobatlas-db
    databaseName: jobatlas
    user: jobatlas
    region: oregon
    plan: free
